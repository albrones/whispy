name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_call:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml so `format --check` is
        # deterministic (a floating newer ruff reformats differently).
        run: pip install "ruff==0.15.21"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests with coverage
        run: .venv/bin/pytest -v --tb=short --cov=src/whispy --cov-report=term-missing --cov-fail-under=84

  test-macos-real-seam:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv and install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      # The model is 639 MB and does not change between runs. Measured on this
      # job: a cache hit restores it in ~10s and downloads nothing.
      - name: Cache the Parakeet weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-parakeet-tdt-0.6b-v3-onnx-int8

      # test_transcription_quality.py is deliberately excluded rather than
      # skipped by accident. It asserts on `say`-synthesized speech, whose
      # output is not byte-stable between runs, so individual phrases flip
      # (measured: "oui" comes back as "We" on roughly half the draws). It is
      # also the only remaining reason anything here would want sox, which CI
      # therefore does not install. It stays a local tool. Everything else is
      # deterministic -- numpy-synthesized noise and committed recordings.
      - name: Run macOS real-seam tests
        run: .venv/bin/pytest -m macos -v --tb=short --timeout=300 --ignore=tests/test_transcription_quality.py

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install deps
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests with coverage
        run: .venv/bin/pytest -v --tb=short --cov=src/whispy --cov-report=term-missing --cov-fail-under=84
