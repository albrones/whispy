name: CI

# Pushes to main run this suite through release.yml (which then publishes the
# version), so it is not triggered here a second time.
on:
  pull_request:
    branches: [main, master]
  workflow_call:

jobs:
  # Repository tooling (scripts/release.py, scripts/build_docs.py) and the
  # guards of the website, docs, install scripts and Omarchy packaging.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to match .pre-commit-config.yaml and requirements-dev.txt so
        # `format --check` is deterministic.
        run: pip install "ruff==0.15.21"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Shell syntax
        run: |
          for f in scripts/bootstrap.sh packaging/linux/reinstall.sh packaging/macos-v2/*.sh packaging/omarchy/omarchy-dictation-whispy; do
            bash -n "$f"
          done

  tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the test tools
        run: pip install -r requirements-dev.txt

      - name: Run the tooling tests
        run: pytest -v --tb=short

  # Whispy V2 (v2/, Rust): unit tests and lint. The engines' model files are
  # not needed here; the bench that uses them runs on a Mac with the models.
  v2:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Cargo test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings

  # Whispy V2 under Linux: the app (`whispy2`, its X11/Wayland layer) and the
  # core. The bench (`banc`) measures macOS memory and is not built here.
  v2-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake clang libclang-dev pkg-config libasound2-dev libxkbcommon-dev

      - name: Toolchain
        run: rustup update stable && rustup default stable && rustup component add clippy

      - name: Cargo test
        run: cargo test --release --locked -p whispy2 -p whispy-core

      - name: Clippy
        run: cargo clippy --release --locked -p whispy2 -p whispy-core --all-targets -- -D warnings
