name: Release

# Fires ONLY on a version tag push (e.g. v0.1.1). Website pushes carry no tag,
# so a website edit never triggers a Homebrew build. Pushing a tag is the
# manual "ship the app" trigger.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    # Runs the full CI suite (lint + all test jobs) against the exact tagged
    # commit in this same workflow run, so a release can't ship from a commit
    # whose CI is red or that was never tested at all.
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        # GitHub auto-attaches the source tarball at
        # /archive/refs/tags/<tag>.tar.gz — no artifact to build ourselves.
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
