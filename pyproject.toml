# Whispy is the Rust app in v2/. Python here is repository tooling only:
# scripts/release.py (versions), scripts/build_docs.py (the docs site) and the
# pytest guards of the website, docs, install scripts and Omarchy packaging.
# Its dependencies are in requirements-dev.txt.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Bounds a single test's runtime so a hang fails fast.
timeout = 120
timeout_method = "thread"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["scripts", "tests"]
extend-exclude = ["v2/target"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402", "E731"]
