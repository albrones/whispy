[package]
name = "whispy2"
version = "2.5.0"
description = "Whispy V2 app (macOS and Linux): a trigger key to dictate, text inserted into the frontmost app"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "whispy2"
path = "src/main.rs"

# Every dependency is justified in openspec/changes/archive/*-v2-menu-bar-app/proposal.md ("Coût").
[dependencies]
whispy-core = { path = "../whispy-core" }
# Microphone capture (CoreAudio on macOS, ALSA on Linux), opened on the default input at each dictation.
cpal = "=0.16.0"
# macOS: V1 detection (proc_listallpids, proc_pidpath). Linux: nothing yet, but harmless.
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Fn key: a listen-only CGEventTap, and the live Fn state to recover a missed release.
core-graphics = "=0.25.0"
core-foundation = "=0.10.1"
# The menu bar icon and menu (NSStatusItem), and main-thread hops for status updates.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSThread", "NSObject", "NSArray", "NSEnumerator", "NSError", "NSTimer", "NSAttributedString", "NSRange", "NSValue", "NSRunLoop", "NSBundle", "NSDictionary"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSCell", "NSButtonCell", "NSRunningApplication", "objc2-core-foundation", "NSGraphics", "NSPanel", "NSWindow", "NSScreen", "NSEvent", "NSLevelIndicator", "NSLevelIndicatorCell", "NSTextField", "NSColor", "NSSound", "NSMenuItem", "NSBezierPath", "NSAttributedString", "NSAppearance", "NSFont", "NSParagraphStyle", "NSStringDrawing", "NSText"] }
# "Start at login": SMAppService.mainApp register/unregister/status for the V2 bundle.
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Alerts as notifications (UNUserNotificationCenter), the V1 alert surface. 0.3.2 is the
# release of the objc2 0.6 / objc2-foundation 0.3.2 family; features trimmed to the center,
# the content and the request, plus `block2` for the completion handlers.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "block2"] }
# The completion-handler blocks of the notification center (same family as objc2 0.6).
block2 = "=0.6.2"
dispatch2 = "=0.3.1"

# Every Linux dependency is justified in openspec/changes/*-v2-linux-app/proposal.md ("Cost").
[target.'cfg(target_os = "linux")'.dependencies]
# The trigger key under X11: XInput 2 raw key events on the root window, read-only
# (no grab), the way pynput's record listener sees every key in V1.
x11rb = { version = "=0.13.2", features = ["xinput"] }
# Typing the text: XTest under X11, the virtual-keyboard protocol under Wayland
# (Hyprland, sway). No libxdo: the pure-Rust x11rb backend.
enigo = { version = "=0.6.1", default-features = false, features = ["x11rb", "wayland"] }
# The X11 tray icon (StatusNotifierItem over D-Bus, pure Rust zbus), blocking API,
# no tokio.
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }
